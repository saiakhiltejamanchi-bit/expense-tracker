{% extends "base.html" %}

{% block title %}{{ title }} | Expense Tracker{% endblock %}

{% block content %}

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save</button>

    <a href="{% url 'tracker:category_list' %}">
      Cancel
    </a>
  </form>
{% endblock %}
